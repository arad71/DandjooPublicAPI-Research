version: '3.3'
services:
  fastapi:
    build:
      context: .
      dockerfile: ./docker/fastapi/Dockerfile
    environment:
      MONGODB_HOST: ${MONGODB_HOST:-mongodb}
      MONGODB_PORT: ${MONGODB_PORT:-27017}
      ROOT_PATH: ${ROOT_PATH:-/api}
      TEMPORARY_FILE_STORAGE_PATH: ${TEMPORARY_FILE_STORAGE_PATH:-/filesubmissions/}
    restart: always
    volumes:
      - submission-data:/filesubmissions/
    networks:
      - dandjoo

  nginx:
    image: nginx
    container_name: dandjoo_nginx
    volumes:
      - ./docker/nginx:/etc/nginx/templates
      - /usr/share/nginx/html:/usr/share/nginx/html
    environment:
      API_HOST: ${API_HOST:-fastapi}
      API_PORT: ${API_PORT:-8000}
    ports:
      - 80:80
    networks:
      - dandjoo
    depends_on:
      - fastapi

volumes:
  submission-data:
    driver: local
